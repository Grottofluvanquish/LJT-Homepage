name: Delete temporary branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary gh-pages branch
        run: gh api --method DELETE repos/${{ github.repository }}/git/refs/heads/gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
